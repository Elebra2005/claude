<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Пульт организатора — Миллор Групп</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/admin.css">
</head>
<body class="admin">
  <section class="login" id="login" hidden>
    <div class="card">
      <h2>🛡️ Пульт организатора</h2>
      <p class="muted">Миллор Групп: Секретная лаборатория</p>
      <form id="f-login">
        <label class="field"><span>Пароль администратора</span><input class="input" type="password" id="pw" autocomplete="current-password" required></label>
        <div class="form-error" id="err"></div>
        <button class="btn big" style="width:100%">Войти</button>
      </form>
    </div>
  </section>

  <div id="panel" hidden>
    <header class="adm-top">
      <div class="adm-title">🛡️ Пульт организатора <span class="muted small">Миллор Групп</span></div>
      <label class="check test-toggle" title="Показывать данные тестовых участников вместо настоящих">
        <input type="checkbox" id="test-mode"><span>Тестовые данные</span></label>
      <a class="btn ghost sm" href="/" target="_blank" rel="noopener">Открыть игру ↗</a>
      <button class="btn ghost sm" id="logout">Выйти</button>
    </header>
    <nav class="adm-tabs" id="tabs">
      <button data-tab="stats">📊 Статистика</button>
      <button data-tab="review">📝 Проверка <span class="badge" id="pending-badge"></span></button>
      <button data-tab="players">👥 Участники</button>
      <button data-tab="codes">🎟️ Коды</button>
      <button data-tab="tasks">🧩 Задания</button>
      <button data-tab="extra">🗝️ Активности</button>
      <button data-tab="awards">🏆 Награды</button>
      <button data-tab="settings">⚙️ Настройки</button>
    </nav>
    <main class="adm-main" id="main"></main>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <script src="/admin.js"></script>
</body>
</html>
