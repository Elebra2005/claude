<text x="290.00" y="85.50" font-size="2.0" text-anchor="start" fill="#111111">1. Аргонные линии — трубка PTFE 6×8</text>
<text x="290.00" y="89.00" font-size="2.0" text-anchor="start" fill="#111111">   или нерж. ¼″, обжимные фитинги.</text>
<text x="290.00" y="92.50" font-size="2.0" text-anchor="start" fill="#111111">2. Обратные клапаны на A1 и A2 — обязательно.</text>
<text x="290.00" y="96.00" font-size="2.0" text-anchor="start" fill="#111111">3. PR-1 (ротаметр с вентилем): синтез 0,1–0,2 л/мин, продувки 3–5, выгрузка ~10.</text>
<text x="290.00" y="99.50" font-size="2.0" text-anchor="start" fill="#c62828">4. Резьбы редукторов/ротаметра — ?</text>
<text x="290.00" y="103.00" font-size="2.0" text-anchor="start" fill="#111111">5. Вакуум только на пустые сухие</text>
<text x="290.00" y="106.50" font-size="2.0" text-anchor="start" fill="#111111">   аппараты; выхлоп VP-1 — в вытяжку.</text>
</svg>