<title>Установка ТЕФКОТ 770</title>
<style>
/* layout: full-screen WebGL viewport, floating control panel top-left */
:root{--bg:#eef1f4;--panel:#ffffffe6;--ink:#1d232a;--mute:#5d6873;--rule:#d5dbe1;--accent:#1f5fa8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15191d;--panel:#1f252bf0;--ink:#e6e9ec;--mute:#9aa5b0;--rule:#333b43;--accent:#6ea8ec;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15191d;--panel:#1f252bf0;--ink:#e6e9ec;--mute:#9aa5b0;--rule:#333b43;--accent:#6ea8ec;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#c{position:fixed;inset:0}
#ui{position:fixed;top:12px;left:12px;max-width:min(320px,calc(100vw - 32px));max-height:calc(100vh - 24px);overflow:auto;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:10px 12px}
#ui h1{font-size:15px;margin:0 0 4px}
#ui p{margin:0 0 8px;color:var(--mute);font-size:12px}
#ui label{display:flex;gap:6px;align-items:center;padding:2px 0;font-size:13px;cursor:pointer}
.views{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 8px}
.views button{font:inherit;font-size:12px;padding:4px 8px;border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:5px;cursor:pointer}
.views button:hover,.views button:focus-visible{border-color:var(--accent);outline:none}
#hover{position:fixed;bottom:12px;left:12px;background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:4px 8px;font-size:12px;display:none}
#load{position:fixed;inset:0;display:grid;place-items:center;color:var(--mute)}
@media (max-width:600px){#ui{max-height:40vh}}
</style>
<canvas id="c"></canvas>
<div id="load">Загрузка модели…</div>
<div id="ui">
  <h1>ТЕФКОТ 770: установка в сборе</h1>
  <p>Реактор и рама — по чертежу Wiggens 8813650C; обвязка — по монтажным чертежам; расстановка вокруг реактора условная. Мышь: вращать / колесо — масштаб / правая — сдвиг.</p>
  <div class="views"><button data-v="iso">Изометрия</button><button data-v="front">Спереди</button><button data-v="side">Сбоку</button><button data-v="top">Сверху</button><button id="sec">Разрез</button></div>
  <div id="groups"></div>
</div>
<div id="hover"></div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const GROUPS = ["Реактор Wiggens 50 л (R-1)", "Рама реактора и тележка управления", "Конденсатор змеевиковый (E-1)", "Гребёнка: шпунт, аварийный сброс, аргон, вакуум, атмосфера; коллектор сбросов", "Узлы крышки реактора: термогильза, дозирование, резерв, манометр, ввод газа", "Генератор метиламина и колонны осушки", "Аргон и вакуум", "Дозирование MeSiCl₃ / PDMS-OH насосом", "Выгрузка, фильтрация, фасовка", "Чиллер и рукава теплоносителя"];
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.localClippingEnabled = true;
const scene = new THREE.Scene();
const dark = matchMedia('(prefers-color-scheme: dark)').matches && document.documentElement.dataset.theme !== 'light';
scene.background = new THREE.Color(dark ? 0x15191d : 0xeef1f4);
const camera = new THREE.PerspectiveCamera(35, 1, 10, 50000);
const controls = new OrbitControls(camera, canvas);
scene.add(new THREE.HemisphereLight(0xffffff, 0x667788, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(2000, 4000, 3000); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.6); fill.position.set(-3000, 1500, -2000); scene.add(fill);
const grid = new THREE.GridHelper(5000, 50, 0x8899aa, dark ? 0x2a3138 : 0xd0d6dc); scene.add(grid);
const clip = new THREE.Plane(new THREE.Vector3(0, 0, -1), 1e5);

function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const target = new THREE.Vector3(0, 900, -100);
function view(v, d = 5200){
  const pos = {iso:[0.62, 0.55, 0.78], front:[0, 0.12, 1], side:[1, 0.12, 0], top:[0, 1, 0.001]}[v] || [0.62,0.55,0.78];
  const n = new THREE.Vector3(...pos).normalize().multiplyScalar(d);
  camera.position.copy(target).add(n); controls.target.copy(target); controls.update();
}
document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => view(b.dataset.v));
let sec = false;
document.getElementById('sec').onclick = () => { sec = !sec; clip.constant = sec ? 0 : 1e5; };

const hover = document.getElementById('hover');
new GLTFLoader().load('tefkot-770-ustanovka.gltf.json', g => {
  const root = g.scene;
  root.traverse(o => { if (o.isMesh) { o.material.side = THREE.DoubleSide; o.material.clippingPlanes = [clip]; o.material.metalness = Math.min(o.material.metalness ?? 0, 0.3); o.material.roughness = 0.55; } });
  scene.add(root);
  const box = document.getElementById('groups');
  const groups = [];
  const norm = t => (t || '').replace(/[\s_\[\]\.:\/]/g, '');
  const want = new Map(GROUPS.map(g => [norm(g), g]));
  root.traverse(o => { const k = norm(o.name); if (want.has(k) && !groups.find(x => x.o === o)) groups.push({ o, label: want.get(k) }); });
  for (const { o, label } of groups) {
    const l = document.createElement('label');
    const c = document.createElement('input'); c.type = 'checkbox'; c.checked = true; c.onchange = () => { o.visible = c.checked; };
    l.append(c, label); box.append(l);
  }
  document.getElementById('load').remove();
  const q = new URLSearchParams(location.search);
  if (q.get('sec')) { sec = true; clip.constant = 0; }
  if (q.get('t')) { const [x, y, z] = q.get('t').split(',').map(Number); target.set(x, z, -y); }
  view(q.get('view') || 'iso', q.get('d') ? +q.get('d') : undefined);
  window.__ready = true;
}, undefined, e => { document.getElementById('load').textContent = 'Не удалось загрузить модель: ' + e.message; });

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
canvas.addEventListener('pointermove', e => {
  mouse.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(scene.children, true).find(h => h.object.isMesh && h.object.visible);
  if (hit) { let o = hit.object; while (o.parent && !o.name) o = o.parent; hover.textContent = (o.name || '').replace(/_/g, ' '); hover.style.display = o.name ? 'block' : 'none'; }
  else hover.style.display = 'none';
});
renderer.setAnimationLoop(() => renderer.render(scene, camera));
</script>
