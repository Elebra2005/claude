# Скопируйте в config.yaml и заполните. Секреты (токен бота) — в .env, не здесь.
wallet_watch:
  enabled: true
  source: onchain        # onchain (бесплатно) | debank (платно, точнее, нужен DEBANK_ACCESS_KEY в .env)
  interval_minutes: 30   # как часто проверять
  telegram_chat_id: "ВАШ_TELEGRAM_CHAT_ID"   # узнать: python3 get_chat_id.py
  report_every_check: true  # отчёт на каждой проверке по всем кошелькам; false — только при изменении
  min_change_usd: 1.0    # при report_every_check: false — изменение меньше этого не присылать
  min_coin_usd: 1.0      # монеты дешевле — пыль, не считаем
  wallets:
    # Лишние кошельки просто удалите. Сети: zerion, arbitrum, solana, starknet, cosmos, bybit.
    # EVM-кошелёк (Rabby, MetaMask…) целиком: все сети, лендинги, стейкинг.
    # Нужен бесплатный ZERION_API_KEY в .env. Без ключа — chain: arbitrum
    # (только Arbitrum и только токены на кошельке).
    - address: "0xВАШ_EVM_АДРЕС"
      label: "Rabby"
      chain: zerion

    - address: "ВАШ_SOLANA_АДРЕС"
      label: "Solana"
      chain: solana

    - address: "0xВАШ_STARKNET_АДРЕС"
      label: "Starknet"
      chain: starknet
      # Пул стейкинга STRK бот находит сам по исходящим переводам STRK.
      # Если не нашёл — можно указать вручную:
      # starknet_delegation_pool: "0xАДРЕС_POOL_КОНТРАКТА"

    # Keplr (сети Cosmos): достаточно адреса cosmos1…, адреса в остальных
    # сетях (osmo1…, celestia1…) бот получит сам.
    - address: "cosmos1ВАШ_АДРЕС"
      label: "Keplr"
      chain: cosmos
      # networks: [cosmoshub, osmosis, celestia]   # опционально, по умолчанию все известные
      # addresses: {injective: "inj1…"}             # Injective — отдельный адрес из Keplr

    # Биржа Bybit: адрес не нужен, баланс берётся по API-ключу (только чтение)
    # из .env: BYBIT_API_KEY / BYBIT_API_SECRET.
    - chain: bybit
      label: "Bybit"
